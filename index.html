<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110c">
  <meta name="description" content="A private, local-first rideshare shift and money dashboard.">
  <title>Driver Command</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to dashboard</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><path d="M13 10h17.5C36.3 10 40 13.7 40 19.5v9C40 34.3 36.3 38 30.5 38H17C11.5 38 8 34.5 8 29V15c0-2.8 2.2-5 5-5Z"/><path d="M16 17h14M16 24h9M16 31h16"/></svg>
        </div>
        <div><strong>Driver Command</strong><span>Money & shift control</span></div>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <span class="local-dot"></span>
        <div><strong>Stored locally</strong><span id="versionLabel">Version 3.6.0</span></div>
      </div>
    </aside>

    <div class="app-column">
      <header class="topbar">
        <div class="mobile-brand" aria-label="Driver Command">
          <span class="mobile-brand-mark">DC</span>
        </div>
        <div class="page-heading">
          <span id="pageEyebrow" class="eyebrow">Command center</span>
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSubtitle">Your shift, money, and vehicle at a glance.</p>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-button" type="button" data-action="toggle-theme" aria-label="Switch theme"></button>
          <button class="button button-primary topbar-start" type="button" data-action="primary-shift-action">
            <span id="topbarShiftIcon" aria-hidden="true"></span><span id="topbarShiftLabel">Start shift</span>
          </button>
        </div>
      </header>

      <main id="mainContent" class="main-content" tabindex="-1"></main>
    </div>
  </div>

  <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="importFileInput" type="file" accept="application/json,.json,text/csv,.csv" hidden>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
